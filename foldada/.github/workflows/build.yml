name: Build EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "SkibidiTRP" --add-data "mellchar.png;." --add-data "mellchar2.webp;." --add-data "mellchar3.png;." --add-data "mellchar4.png;." --add-data "mellchar5.png;." --add-data "mellloadback.jpg;." --add-data "KroloSceneFRST.gif;." mellgame.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkibidiTRP-exe
          path: dist/SkibidiTRP.exe

      - name: Attach EXE to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SkibidiTRP.exe